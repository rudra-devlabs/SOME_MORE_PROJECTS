<!DOCTYPE html>
<html>
<head>
  <title>Browser Clock</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <button id="close-pip" aria-label="Close" title="Close">&#10005;</button>
  <div class="tabs">
    <button class="tab-link active" data-tab="clock">Clock</button>
    <button class="tab-link" data-tab="stopwatch">Stopwatch</button>
    <button class="tab-link" data-tab="timer">Timer</button>
  </div>

  <div id="clock" class="tab-content active">
    <div class="flip-clock"></div>
  </div>

  <div id="stopwatch" class="tab-content">
    <div class="flip-clock"></div>
    <div class="controls flex-col">
      <button id="toggle-stopwatch" class="circular-toggle">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="secondary-controls">
        <button id="reset-stopwatch">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg> Reset
        </button>
        <button id="lap-stopwatch">
          <svg viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg> Lap
        </button>
      </div>
    </div>
    <ul id="laps"></ul>
  </div>

  <div id="timer" class="tab-content">
    <div class="flip-clock"></div>
    <div class="input-group timer-inputs">
      <input type="number" id="timer-hours" min="0" placeholder="HH">
      <input type="number" id="timer-minutes" min="0" max="59" placeholder="MM">
      <input type="number" id="timer-seconds" min="0" max="59" placeholder="SS">
    </div>
    <div class="controls flex-col">
      <button id="toggle-timer" class="circular-toggle">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="secondary-controls">
        <button id="reset-timer">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg> Reset
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
